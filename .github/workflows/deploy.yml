name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          # Puente durante el cambio de nombre: usa la clave nueva si ya existe
          # como secreto, y si no la de siempre. Asi el deploy no se cae el dia
          # que entra el renombrado y antes de crear el secreto nuevo.
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_KEY }}
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          VITE_WHATSAPP_PHONE: ${{ vars.VITE_WHATSAPP_PHONE }}
          # Enlaces de pago de Culqi. Van en `vars` y no en `secrets` porque no
          # son secretos: quien llega a la pagina de pago ve la misma direccion.
          # El que falte deja su plan cobrando por WhatsApp.
          VITE_CULQI_LINK_6_50: ${{ vars.VITE_CULQI_LINK_6_50 }}
          VITE_CULQI_LINK_9: ${{ vars.VITE_CULQI_LINK_9 }}
          VITE_CULQI_LINK_11: ${{ vars.VITE_CULQI_LINK_11 }}
          API_SECRET: ${{ secrets.API_SECRET }}
      
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy